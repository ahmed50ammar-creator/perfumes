<!doctype html>
<html lang="ar" dir="rtl"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#5B2A86">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<title>دليل العطور</title>
<style>
:root{--bg:#F5F3F7;--card:#fff;--fg:#1D1A24;--mute:#6B6577;--line:#E1DCE8;--accent:#5B2A86;--accent-fg:#fff;--price:#0E6B4A;--warn:#8A5A00}
@media (prefers-color-scheme:dark){:root{--bg:#15121B;--card:#201C29;--fg:#F0EDF5;--mute:#A29BB0;--line:#322C3E;--accent:#B98CF0;--accent-fg:#15121B;--price:#5FD3A3;--warn:#E9B64D;color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font-family:system-ui,'Segoe UI',Tahoma,sans-serif;font-size:16px;padding:env(safe-area-inset-top) max(14px,env(safe-area-inset-right)) 40px max(14px,env(safe-area-inset-left))}
.wrap{max-width:640px;margin:0 auto}
header{position:sticky;top:0;background:var(--bg);padding:12px 0 8px;z-index:5}
.bar{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
h1{font-size:19px;margin:0}.count{color:var(--mute);font-size:13px}
.srow{display:flex;gap:8px}
input[type=search]{flex:1;min-width:0;font:inherit;font-size:17px;padding:13px 14px;border:1.5px solid var(--line);border-radius:10px;background:var(--card);color:var(--fg)}
button,label.b{font:inherit;cursor:pointer}
.cambtn{background:var(--accent);color:var(--accent-fg);border:0;border-radius:10px;padding:0 16px;font-weight:700;font-size:15px;white-space:nowrap}
.ghost{background:none;border:1px solid var(--line);color:var(--fg);border-radius:8px;padding:8px 12px;font-size:14px}
#camwrap{position:relative;margin-top:8px;border-radius:12px;overflow:hidden;background:#000;aspect-ratio:4/3}
#camwrap[hidden]{display:none}
video{width:100%;height:100%;object-fit:cover;display:block}
#guide{position:absolute;inset:30% 8%;border:2px solid #fff;border-radius:10px;box-shadow:0 0 0 999px rgba(0,0,0,.35);pointer-events:none}
#camstate{position:absolute;bottom:8px;inset-inline:8px;color:#fff;background:rgba(0,0,0,.55);padding:6px 10px;border-radius:8px;font-size:14px;text-align:center}
#list{display:flex;flex-direction:column;gap:10px;margin-top:10px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 16px;display:grid;gap:4px}
.fn{font-family:Georgia,'Times New Roman',serif;font-weight:700;font-size:26px;direction:ltr;text-align:right;overflow-wrap:anywhere}
.ar{font-size:18px;font-weight:600}.house{color:var(--mute);font-size:14px;direction:ltr;text-align:right;overflow-wrap:anywhere}
.row{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap;margin-top:6px}
.meta{font-size:13px;color:var(--mute)}.meta b{background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:1px 8px;color:var(--fg);margin-inline-end:6px}
.price{font-size:26px;font-weight:800;color:var(--price)}.price small{font-size:14px}
.note{color:var(--mute);padding:18px 4px;text-align:center}.warn{color:var(--warn);font-weight:600;padding:6px 2px}
details{margin-top:18px;color:var(--mute);font-size:14px}summary{cursor:pointer;padding:8px 0}
.tools{display:flex;gap:8px;flex-wrap:wrap;margin:6px 0}input[type=file]{display:none}
</style></head><body>
<div class="wrap">
<header>
 <div class="bar"><h1>دليل العطور</h1><span class="count" id="count"></span></div>
 <div class="srow"><input id="q" type="search" placeholder="اسم / كود / فاشون هاوس — عربي أو English" autocomplete="off"><button class="cambtn" id="camtoggle">📷 كاميرا</button></div>
 <div id="camwrap" hidden><video id="v" playsinline muted></video><div id="guide"></div><div id="camstate">...</div></div>
</header>
<div id="status" class="warn" hidden></div>
<main id="list"></main>
<details><summary>تحديث الأسعار</summary>
 <p>ارفع ملف CSV بالأعمدة: Code, FashionHouse, FantasyName, Type, ArabicName, Price. الأسعار القديمة تتبدل كلها مرة واحدة.</p>
 <div class="tools"><label class="b ghost">رفع ملف أسعار جديد<input id="imp" type="file" accept=".csv,text/csv,text/plain"></label><button class="ghost" id="reset">الرجوع للقائمة الأصلية</button></div>
 <div id="impmsg"></div></details>
</div>
<script src="data.js"></script>
<script>
const $=id=>document.getElementById(id);const KEY='ff_items_v1';const TYPES={FM:'رجالي',FF:'حريمي',FO:'زيوت / عود',UN:'للجنسين'};
const junk=/[^A-Z0-9؀-ۿ ]/g;
function norm(s){return String(s).toUpperCase().replace(/[ً-ٟـ]/g,'').replace(/[أإآ]/g,'ا').replace(/ى/g,'ي').replace(/ة/g,'ه').replace(junk,' ').replace(/\s+/g,' ').trim()}
const key=s=>norm(s).replace(/ /g,'');
function lev(a,b){let p=Array.from({length:b.length+1},(_,i)=>i);for(let i=1;i<=a.length;i++){const c=[i];for(let j=1;j<=b.length;j++)c[j]=Math.min(c[j-1]+1,p[j]+1,p[j-1]+(a[i-1]===b[j-1]?0:1));p=c}return p[b.length]}
function bestSim(k,t){let best=0;for(const L of [k.length-1,k.length,k.length+1]){if(L<3||L>t.length)continue;for(let i=0;i+L<=t.length;i++){const w=t.substr(i,L);if(w[0]===k[0]||w[L-1]===k[k.length-1])best=Math.max(best,1-lev(k,w)/Math.max(k.length,L))}}return best}
let items=[];
const prep=rows=>rows.map(r=>({code:r[0],house:r[1],fantasy:r[2],type:r[3],ar:r[4],price:r[5],fk:key(r[2]),hay:norm(r.slice(0,5).join(' '))}));
function load(){try{const s=localStorage.getItem(KEY);if(s){const o=JSON.parse(s);if(o.rows&&o.rows.length)return o}}catch(e){}return {rows:BUNDLED,when:null}}
function setItems(){const d=load();items=prep(d.rows);$('count').textContent=items.length+' صنف'+(d.when?' · تحديث '+d.when:'')}
function search(q){const t=norm(q).split(' ').filter(Boolean);if(!t.length)return[];const k=key(q);return items.filter(i=>t.every(x=>i.hay.includes(x))).sort((a,b)=>(b.fk.startsWith(k))-(a.fk.startsWith(k)))}
function fromText(text,max=3){const t=key(text);if(t.length<3)return[];const h=[];for(const i of items){if(i.fk.length<3)continue;if(t.includes(i.fk)){h.push({i,s:100+i.fk.length});continue}const s=bestSim(i.fk,t);if(s>=.82)h.push({i,s:Math.round(s*100)})}return h.sort((a,b)=>b.s-a.s).slice(0,max)}
function card(i){const c=document.createElement('div');c.className='card';const add=(cl,t)=>{const d=document.createElement('div');d.className=cl;d.textContent=t;c.appendChild(d)};
 add('fn',i.fantasy);add('ar',i.ar);add('house',i.house);
 const r=document.createElement('div');r.className='row';const m=document.createElement('div');m.className='meta';const b=document.createElement('b');b.textContent=TYPES[i.type]||i.type;m.append(b,i.code);
 const p=document.createElement('div');p.className='price';p.textContent=Number(i.price).toLocaleString('en-US');const u=document.createElement('small');u.textContent=' ج';p.appendChild(u);r.append(m,p);c.appendChild(r);return c}
function show(list,empty){const el=$('list');el.replaceChildren();if(!list.length){const n=document.createElement('div');n.className='note';n.textContent=empty;el.appendChild(n);return}list.slice(0,60).forEach(i=>el.appendChild(card(i)))}
function status(m){const s=$('status');s.hidden=!m;s.textContent=m||''}
$('q').addEventListener('input',e=>{status('');const v=e.target.value;show(search(v),v.trim()?'مفيش نتائج':'اكتب اسم العطر أو كوده، أو افتح الكاميرا')});

/* ---------- الكاميرا المباشرة ---------- */
let stream=null,worker=null,running=false,lastTop=null;
async function ensureWorker(){if(worker)return worker;
 if(!window.Tesseract)throw new Error('لازم نت أول مرة عشان نحمّل القارئ');
 worker=await Tesseract.createWorker('eng',1,{});
 await worker.setParameters({tessedit_char_whitelist:'ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789 ',tessedit_pageseg_mode:'11'});return worker}
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
async function startCam(){const st=$('camstate');$('camwrap').hidden=false;$('camtoggle').textContent='✕ إغلاق';st.textContent='جاري تشغيل الكاميرا...';
 try{stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'},width:{ideal:1280},height:{ideal:960}},audio:false});}
 catch(e){st.textContent='مفيش إذن للكاميرا. فعّله من إعدادات الموقع في كروم.';return}
 $('v').srcObject=stream;await $('v').play();running=true;lastTop=null;
 try{st.textContent='جاري تجهيز القراءة (أول مرة بتاخد وقت)...';await ensureWorker()}catch(e){st.textContent=String(e.message||e);return}
 st.textContent='وجّه الكاميرا على الفانتزي نيم';loop()}
function stopCam(){running=false;if(stream){stream.getTracks().forEach(t=>t.stop());stream=null}$('camwrap').hidden=true;$('camtoggle').textContent='📷 كاميرا'}
async function loop(){const v=$('v'),cv=document.createElement('canvas'),cx=cv.getContext('2d',{willReadFrequently:true});
 while(running){
  try{const W=v.videoWidth,H=v.videoHeight;if(W){
   // نقص المنطقة اللي جوه الإطار الأبيض (٨٪ من اليمين واليسار، ٣٠٪ من فوق وتحت)
   const sx=W*.08,sy=H*.30,sw=W*.84,sh=H*.40;const scale=Math.min(1,900/sw);cv.width=Math.round(sw*scale);cv.height=Math.round(sh*scale);
   cx.drawImage(v,sx,sy,sw,sh,0,0,cv.width,cv.height);
   const im=cx.getImageData(0,0,cv.width,cv.height),d=im.data;for(let i=0;i<d.length;i+=4){let g=.3*d[i]+.59*d[i+1]+.11*d[i+2];g=(g-128)*1.5+128;d[i]=d[i+1]=d[i+2]=g<0?0:g>255?255:g}cx.putImageData(im,0,0);
   const r=await worker.recognize(cv);const hits=fromText(r.data.text||'');
   if(hits.length){const top=hits[0];const sure=top.s>=100||lastTop===top.i.code;
    if(sure){show(hits.map(h=>h.i));status(top.s<100?'مش متأكد 100% — اختار الصح من الأقرب:':'');$('camstate').textContent='✓ '+top.i.fantasy}
    lastTop=top.i.code}else{lastTop=null}}}catch(e){}
  await sleep(250)}}
$('camtoggle').addEventListener('click',()=>stream?stopCam():startCam());
document.addEventListener('visibilitychange',()=>{if(document.hidden&&stream)stopCam()});

/* ---------- تحديث الأسعار ---------- */
function parseCsv(s){s=s.replace(/^﻿/,'');const rows=[];let row=[],cell='',q=false;for(let i=0;i<s.length;i++){const c=s[i];if(q&&c==='"'&&s[i+1]==='"'){cell+='"';i++}else if(c==='"')q=!q;else if(!q&&c===','){row.push(cell);cell=''}else if(!q&&(c==='\n'||c==='\r')){if(c==='\r'&&s[i+1]==='\n')i++;row.push(cell);cell='';if(row.some(x=>x.trim()))rows.push(row);row=[]}else cell+=c}if(cell||row.length){row.push(cell);if(row.some(x=>x.trim()))rows.push(row)}return rows}
$('imp').addEventListener('change',async e=>{const f=e.target.files[0];e.target.value='';if(!f)return;const m=$('impmsg');
 try{const num=x=>parseFloat(String(x).replace(/,/g,''));
  const rows=parseCsv(await f.text()).slice(1).filter(r=>r.length>=6&&r[0].trim()&&r[2].trim()&&!isNaN(num(r[5]))).map(r=>[r[0].trim(),r[1].trim(),r[2].trim(),r[3].trim().toUpperCase(),r[4].trim(),Math.round(num(r[5]))]);
  if(!rows.length)throw 0;localStorage.setItem(KEY,JSON.stringify({rows,when:new Date().toLocaleDateString('ar-EG')}));setItems();m.textContent='تم تحديث '+rows.length+' صنف.'}
 catch(x){m.textContent='الملف مش بالشكل المطلوب، ما اتغيرش حاجة.'}});
$('reset').addEventListener('click',()=>{try{localStorage.removeItem(KEY)}catch(e){}setItems();$('impmsg').textContent='رجعت للقائمة الأصلية.'});

setItems();show([],'اكتب اسم العطر أو كوده، أو افتح الكاميرا');
if('serviceWorker'in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/tesseract.min.js" async></script>
</body></html>
